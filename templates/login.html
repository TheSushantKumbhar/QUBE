<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <link rel="stylesheet" href="/static/css/output.css">
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center h-screen">
    <div class="container mx-auto mt-6 px-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div id="flash-messages" class="fixed top-4 right-4 space-y-2 z-50">
                    {% for category, message in messages %}
                        <div class="px-4 py-3 rounded-lg shadow-md text-white 
                            {% if category == 'success' %} bg-indigo-300 {% elif category == 'danger' %} bg-indigo-600 {% elif category == 'info' %} bg-indigo-200 {% else %} bg-indigo-200 {% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
                <script>
                    setTimeout(() => {
                        document.getElementById('flash-messages').style.display = 'none';
                    }, 3000);
                </script>
            {% endif %}
        {% endwith %}
    </div>
    <div class="bg-white p-6 rounded-lg shadow-lg w-1/3">
        <h2 class="text-xl font-bold mb-4 text-center">Login</h2>
        <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-4">
            <input type="email" name="email" placeholder="Email" required class="w-full p-2 border rounded">
            <input type="password" name="password" placeholder="Password" required class="w-full p-2 border rounded">
            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded">Login</button>
        </form>
        <div class="mt-4 text-center">
            <a href="{{ url_for('auth.signup') }}" class="text-blue-500">Create an Account</a> |
            <a href="{{ url_for('auth.reset_password') }}" class="text-blue-500">Forgot Password?</a>
        </div>
    </div>
</body>
</html>
