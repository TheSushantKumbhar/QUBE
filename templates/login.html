<!DOCTYPE html>
<html lang="en">
<head>
    <title>Home</title>
    <link rel="stylesheet" href="/static/css/output.css">
</head>
<body class="bg-gray-100">
    <nav class="bg-blue-500 text-white p-4 flex justify-between items-center">
        <div class="text-xl font-bold">Quiz app</div>
        <div>
            <button onclick="toggleModal()" class="bg-white text-blue-500 px-4 py-2 rounded">Login</button>
        </div>
    </nav>

    <div id="loginModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg shadow-lg w-1/3 relative">
            <button onclick="toggleModal()" class="absolute top-2 right-2 text-gray-600">&times;</button>
            <h2 class="text-xl font-bold mb-4">Login</h2>
            <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-4">
                <input type="email" name="email" placeholder="Email" required class="w-full p-2 border rounded">
                <input type="password" name="password" placeholder="Password" required class="w-full p-2 border rounded">
                <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded">Login</button>
            </form>
            <div class="mt-4 text-center">
                <a href="{{ url_for('auth.signup') }}" class="text-blue-500">Create an Account</a> |
                <a href="{{ url_for('auth.reset_password') }}" class="text-blue-500">Forgot Password?</a>
            </div>
        </div>
    </div>

    <script>
        function toggleModal() {
            document.getElementById('loginModal').classList.toggle('hidden');
        }
    </script>
</body>
</html>
