<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">
  <div class="bg-white p-6 rounded-lg shadow-lg w-96">
    <h2 class="text-2xl font-bold mb-4 text-center">Sign Up</h2>

    {% with messages = get_flashed_messages(with_categories=true) %} {% if
    messages %}
    <div class="fixed top-4 right-6 space-y-2 z-50">
      {% for category, message in messages %}
      <div class="px-4 py-2 rounded-md shadow-md
         text-white {% if category == 'success' %} bg-green-500 {% elif category == 'danger' %}
          bg-red-500 {% else %} bg-gray-500 {% endif %}">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %} {% endwith %}

    <form action="{{ url_for('auth.signup') }}" method="POST" enctype="multipart/form-data" class="space-y-4">
      <input type="email" name="email" placeholder="Email" required class="w-full p-2 border rounded-lg" /><br />

      <input type="text" name="username" placeholder="Username (Optional)" class="w-full p-2 border rounded-lg" /><br />

      <input type="password" name="password" placeholder="Password" required
        class="w-full p-2 border rounded-lg" /><br />

      <input type="password" name="confirm_password" placeholder="Confirm Password" required
        class="w-full p-2 border rounded-lg" /><br />

      <input type="file" name="profile_pic" accept=".png, .jpg, .jpeg" class="w-full" /><br />

      <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded-lg">
        Sign Up
      </button>
    </form>

    <p class="text-center mt-4">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="text-blue-600">Login</a>
    </p>
  </div>
</body>

</html>
