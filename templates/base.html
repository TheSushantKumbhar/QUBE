<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/YOUR_KIT_CODE.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/static/css/output.css">
    <title>{% block title %}QUBE{% endblock %}</title>
    <style>
        :root {
            --sidebar-width: 13rem;
            --content-margin: 13rem;
        }

        #sidebar {
            width: var(--sidebar-width);
            transition: width 0.15s ease-out;
            will-change: width;
        }

        #main-content {
            margin-left: var(--content-margin);
            transition: margin-left 0.15s ease-out;
            will-change: margin-left;
        }
    </style>
    <script>
        (function () {
            const sidebarState = localStorage.getItem('sidebarOpen');
            if (sidebarState === 'false') {
                document.documentElement.style.setProperty('--sidebar-width', '6rem');
                document.documentElement.style.setProperty('--content-margin', '6rem');
                document.documentElement.classList.add('sidebar-collapsed');
            }
        })();
    </script>
    <style>
        /* For WebKit browsers (Chrome, Safari) */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #e5e7eb;
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #6366f1;
            border-radius: 8px;
            border: 2px solid #e5e7eb;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4f46e5;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: #6366f1 #e5e7eb;
        }

        body {
            opacity: 0;
        }

        body.loaded {
            opacity: 1;
            transition: opacity 0.1s ease;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            transition: background-color 0.15s ease;
        }

        .nav-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .nav-icon {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 2rem;
            flex-shrink: 0;
        }

        .fa-icon {
            font-size: 1.25rem;
        }

        .png-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
            transition: width 0.15s ease, height 0.15s ease;
        }

        /* For collapsed sidebar, center the icons */
        .sidebar-collapsed .nav-item {
            justify-content: center;
            padding: 0.75rem 0;
        }

        .sidebar-collapsed .nav-icon {
            margin: 0 auto;
            padding: 0;
        }

        .sidebar-collapsed .png-icon {
            margin-right: 0;
            width: 24px;
            height: 24px;
        }

        .png-icon {
            display: none;
        }

        .use-png-icons .fa-icon {
            display: none;
        }

        .use-png-icons .png-icon {
            display: block;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            margin-right: 5px;
            transition: background-color 0.15s ease;
        }

        .logo-container:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .logo-image {
            width: 28px;
            height: 28px;
            margin-right: 8px;
            object-fit: contain;
            transition: width 0.15s ease, height 0.15s ease;
        }

        /* For collapsed sidebar - only show logo, not text */
        .sidebar-collapsed .logo-text {
            display: none;
        }

        .sidebar-collapsed .logo-image {
            margin-right: 0;
            width: 32px;
            height: 32px;
            display: block !important;
            /* Force display */
        }

        /* Profile capsule styles */
        .profile-container {
            position: absolute;
            bottom: 1rem;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            z-index: 30;
            margin-bottom: 15px;
        }

        .profile-capsule {
            position: relative;
            display: flex;
            align-items: center;
            padding: 0.5rem;
            border-radius: 2rem;
            background-color: rgba(255, 255, 255, 0.192);
            cursor: pointer;
            transition: all 0.2s ease;
            width: 80%;
        }

        .profile-capsule:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .profile-image {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffffff;
        }

        .profile-info {
            margin-left: 0.75rem;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .drop-up {
            position: absolute;
            bottom: calc(100% + 8px);
            /* Position above the profile capsule with gap */
            left: 0;
            width: 100%;
            border-radius: 0.5rem;
            box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.1), 0 -2px 4px rgba(0, 0, 0, 0.06);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.2s ease;
            z-index: 40;
            overflow: hidden;

        }

        /* Only show drop-up when not in collapsed mode */
        body:not(.sidebar-collapsed) .profile-capsule:hover .drop-up {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .drop-up-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            transition: background-color 0.15s ease;
        }

        .drop-up-item:hover {
            background-color: #f3f4f6;
        }

        /* Dark mode styles for drop-up */
        .dark .drop-up {

            box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.3), 0 -2px 4px rgba(0, 0, 0, 0.2);
            color: #f3f4f6;
        }

        .dark .drop-up-item:hover {
            background-color: #374151;
        }

        .sidebar-collapsed .profile-info {
            display: none;
        }

        .sidebar-collapsed .profile-capsule {
            width: auto;
            padding: 0.25rem;
        }

        /* Dark mode toggle in dropdown */
        .dark-toggle-container {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            cursor: pointer;
        }

        .dark-toggle-container:hover {
            background-color: #f3f4f6;
        }

        .dark .dark-toggle-container:hover {
            background-color: #374151;
        }

        /* Hide dropdown elements in collapsed state */
        .sidebar-collapsed .drop-up {
            display: none;
        }

        /* Add styles for the PNG icons in the profile dropdown */
        .drop-up-icon {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            object-fit: contain;
        }

        .use-png-icons .drop-up .fa-icon {
            display: none;
        }

        .use-png-icons .drop-up .drop-up-icon {
            display: block;
        }
    </style>
</head>

<body class="flex bg-indigo-700 dark:bg-black">
    <!-- Sidebar -->
    <nav id="sidebar"
        class="bg-indigo-700 dark:bg-black h-screen shadow-md fixed left-0 top-0 flex flex-col z-10 overflow-hidden use-png-icons">
        <div class="p-6 flex flex-col w-full">
            <!-- Logo and Toggle Button Row -->
            <div class="flex items-center justify-center">
                <!-- Logo as button -->
                <div id="logo-button" class="logo-container">
                    <img src="/static/images/cube.png" class="logo-image" alt="QUBE Logo">
                    <span class="logo-text text-2xl font-bold text-white">Q U B E</span>
                </div>
            </div>

            <!-- Navigation Links -->
            <div class="mt-12 flex flex-col space-y-3 w-full">
                <a href="/" class="nav-item text-white hover:text-blue-500">
                    <span class="nav-icon">
                        <!-- <i class="fa-icon fas fa-home"></i> -->
                        <!-- <img src="/static/images/home2.png" class="png-icon" alt="Home"> -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-house-icon lucide-house">
                            <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
                            <path
                                d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                        </svg>
                    </span>
                    <span class="nav-text ml-3">Home</span>
                </a>
                <a href="{{ url_for('quiz.explore_quizzes')}}" class="nav-item text-white hover:text-blue-600">
                    <span class="nav-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-globe-icon lucide-globe">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
                            <path d="M2 12h20" />
                        </svg>
                    </span>
                    <span class="nav-text ml-3">Explore</span>
                </a>
                <a href="{{url_for('live.live_home')}}" class="nav-item text-white hover:text-blue-600">
                    <span class="nav-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-router-icon lucide-router">
                            <rect width="20" height="8" x="2" y="14" rx="2" />
                            <path d="M6.01 18H6" />
                            <path d="M10.01 18H10" />
                            <path d="M15 10v4" />
                            <path d="M17.84 7.17a4 4 0 0 0-5.66 0" />
                            <path d="M20.66 4.34a8 8 0 0 0-11.31 0" />
                        </svg>
                    </span>
                    <span class="nav-text ml-3">Live</span>
                </a>
                <a href="{{ url_for('quiz.quiz_categories')}}" class="nav-item text-white hover:text-blue-600">
                    <span class="nav-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-badge-plus-icon lucide-badge-plus">
                            <path
                                d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z" />
                            <line x1="12" x2="12" y1="8" y2="16" />
                            <line x1="8" x2="16" y1="12" y2="12" />
                        </svg>
                    </span>
                    <span class="nav-text ml-3">Create Quiz</span>
                </a>
                <a href="{{url_for('analytics.analytics_dashboard')}}" class="nav-item text-white hover:text-blue-600">
                    <span class="nav-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-chart-column-increasing-icon lucide-chart-column-increasing">
                            <path d="M13 17V9" />
                            <path d="M18 17V5" />
                            <path d="M3 3v16a2 2 0 0 0 2 2h16" />
                            <path d="M8 17v-3" />
                        </svg>
                    </span>
                    <span class="nav-text ml-3">Analytics</span>
                </a>
            </div>

            <!-- Profile Capsule Container (will be transformed to direct link when collapsed) -->
            <div class="profile-container">
                <div id="profile-element" class="profile-capsule">

                    <!-- <img src="{{profile_pic}}" alt="Profile" class="profile-image"> -->
                    {% if profile_pic %}
                    <img src="{{ profile_pic }}" alt="Profile" class="profile-image">
                    {% else %}
                    <img src="/static/images/default.png" alt="Profile" class="profile-image">
                    {% endif %}
                    <div class="profile-info">
                        <div class="font-medium">{{username}}</div>
                        <div class="text-xs text-gray-300"></div>
                    </div>

                    <!-- Drop-up Menu with PNG icon slots - only visible in expanded state -->
                    <div class="drop-up bg-indigo-200 dark:bg-zinc-800 space-y-2 p-2 rounded-lg">
                        <!-- My Profile -->
                        <a href="{{url_for('auth.update_profile')}}" class="drop-up-item flex items-center gap-3 p-2 hover:bg-indigo-300 dark:hover:bg-zinc-700 rounded">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 21a8 8 0 0 1 10.821-7.487" />
                                <path
                                    d="M21.378 16.626a1 1 0 0 0-3.004-3.004l-4.01 4.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z" />
                                <circle cx="10" cy="8" r="5" />
                            </svg>
                            <span>My Profile</span>
                        </a>
                    
                        <!-- My Quizzes -->
                        <a href="{{url_for('quiz.my_quizzes')}}" class="drop-up-item flex items-center gap-3 p-2 hover:bg-indigo-300 dark:hover:bg-zinc-700 rounded">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z" />
                            </svg>
                            <span>My Quizzes</span>
                        </a>
                    
                        <!-- Dark Mode Toggle -->
                        <div class="flex items-center gap-3 p-2 hover:bg-indigo-300 dark:hover:bg-zinc-700 rounded">
                            <button id="dark-toggle" class="w-10 h-10 rounded-full flex items-center justify-center bg-gray-200 dark:bg-gray-700 transition-colors">
                                <!-- Sun (dark mode) -->
                                <svg id="sun-icon" class="hidden dark:block w-6 h-6 text-yellow-400" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                                    </path>
                                </svg>
                                <!-- Moon (light mode) -->
                                <svg id="moon-icon" class="block dark:hidden w-6 h-6 text-gray-800" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                                </svg>
                            </button>
                            <span>Dark Mode</span>
                        </div>
                    
                        <!-- Logout -->
                        <a href="{{url_for('auth.logout')}}" class="drop-up-item flex items-center gap-3 text-red-500 p-2 hover:bg-red-100 dark:hover:bg-zinc-700 rounded">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                                <polyline points="16 17 21 12 16 7" />
                                <line x1="21" x2="9" y1="12" y2="12" />
                            </svg>
                            <span>Logout</span>
                        </a>
                    </div>                    
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Wrapper -->
    <div id="main-content" class="w-full">
        <!-- White Content Container -->
        <div id="content-container"
            class="bg-gray-100 dark:bg-zinc-800 rounded-2xl mt-3 mr-3 mb-3 h-95vh overflow-auto shadow-lg">
            <!-- Page Content (Dynamic Section) -->
            <div class="p-6">
                {% block content %}

                {% endblock %}
            </div>
        </div>
    </div>
    <script src="/static/js/darkMode.js"></script>
    <script src="/static/js/base.js"></script>
</body>

</html>
