<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/YOUR_KIT_CODE.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/static/css/output.css">
    <title>{% block title %}QUBE{% endblock %}</title>
    <style>
        /* For WebKit browsers (Chrome, Safari) */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #e5e7eb;
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #6366f1;
            border-radius: 8px;
            border: 2px solid #e5e7eb;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4f46e5;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: #6366f1 #e5e7eb;
        }

        /* Hide scrollbar but allow scrolling */
        /* ::-webkit-scrollbar {
            overflow: auto;
            scrollbar-width: none;
           
        }

        ::-webkit-scrollbar {
            display: none;
        } */
    </style>
</head>

<body class="flex bg-indigo-700">

    <!-- Sidebar -->
    <nav id="sidebar"
        class="bg-indigo-700 h-screen shadow-md fixed left-0 top-0 flex flex-col transition-all duration-300 z-10 overflow-hidden"
        style="width: 13rem;">
        <div class="p-6 flex flex-col w-full">
            <!-- Logo and Toggle Button Row -->
            <div class="flex items-center justify-between">
                <a href="/" class="mt-5 text-2xl font-bold text-white" id="logo">Q U B E</a>
                <!-- button -->
                <button id="sidebar-toggle" class="text-white bg-indigo-600 p-2 rounded-md hover:bg-indigo-800">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

            <!-- Navigation Links -->
            <div class="mt-12 flex flex-col space-y-6 w-full">
                <a href="/" class="flex items-center text-white hover:text-blue-500"><i class="fas fa-home mr-3"></i>
                    <span class="nav-text">Home</span></a>
                <a href="{{ url_for('quiz.explore_quizzes')}}"
                    class="flex items-center text-white hover:text-blue-600"><i class="fas fa-search mr-3"></i> <span
                        class="nav-text">Explore</span></a>
                <a href="{{url_for('live.live_home')}}" class="flex items-center text-white hover:text-blue-600"><i
                        class="fas fa-bolt mr-3"></i> <span class="nav-text">Live</span></a>
                <a href="{{ url_for('quiz.quiz_categories')}}"
                    class="flex items-center text-white hover:text-blue-600"><i class="fas fa-plus-circle mr-3"></i>
                    <span class="nav-text">Create Quiz</span></a>
                <a href="/analytics" class="flex items-center text-white hover:text-blue-600"><i
                        class="fas fa-chart-bar mr-3"></i> <span class="nav-text">Analytics</span></a>
            </div>
        </div>
    </nav>

    <!-- Main Content Wrapper -->
    <div id="main-content" class="transition-all duration-300 w-full" style="margin-left: 13rem;">

        <!-- White Content Container -->
        <div id="content-container"
            class="bg-gray-100 rounded-2xl mt-3 mr-3 mb-3  h-95vh overflow-auto shadow-lg transition-all duration-300">
            <!-- Page Content (Dynamic Section) -->
            <div class="p-6">
                {% block content %}

                {% endblock %}
            </div>
        </div>
    </div>

    <!-- <script src="/static/js/loading.js"></script> -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            const contentContainer = document.getElementById('content-container');
            const toggleBtn = document.getElementById('sidebar-toggle');
            const logo = document.getElementById('logo');
            const navTexts = document.querySelectorAll('.nav-text');
            let sidebarOpen = true;

            // Use CSS-based sizing instead of JavaScript calculations
            // This single line will replace the adjustContainerSize function
            contentContainer.style.height = 'calc(100vh - 24px)';

            toggleBtn.addEventListener('click', function () {
                if (sidebarOpen) {
                    // Collapse sidebar
                    sidebar.style.width = '4rem';
                    mainContent.style.marginLeft = '4rem';

                    // Hide text elements
                    logo.style.display = 'none';
                    navTexts.forEach(text => {
                        text.style.display = 'none';
                    });
                } else {
                    // Expand sidebar
                    sidebar.style.width = '13rem';
                    mainContent.style.marginLeft = '13rem';

                    // Show text elements
                    logo.style.display = 'block';
                    navTexts.forEach(text => {
                        text.style.display = 'inline';
                    });
                }
                sidebarOpen = !sidebarOpen;
            });
        });
    </script>
</body>

</html>
