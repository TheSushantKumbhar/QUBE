<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="/static/css/output.css">
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">

    <div class="bg-white p-6 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold mb-4 text-center">Profile</h2>

        <!-- Corrected Profile Picture Handling -->
        <img src="{{ url_for('static', filename=user.profile_pic or 'profile_pics/default.jpg') }}" 
             alt="Profile Picture" 
             class="w-24 h-24 rounded-full mx-auto border border-gray-300 shadow-md object-cover">

        <p class="text-center mt-4 text-gray-600">Email: {{ user.email }}</p>
        
        <form action="{{ url_for('auth.update_profile') }}" method="POST" enctype="multipart/form-data" class="mt-4 space-y-4">
            <input type="text" name="username" value="{{ user.username }}" placeholder="Update Username" class="w-full p-2 border rounded-lg"><br>

            <input type="file" name="profile_pic" accept=".png, .jpg, .jpeg" class="w-full"><br>

            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded-lg">Save Changes</button>
        </form>

        <a href="{{ url_for('auth.logout') }}" class="block text-center text-red-600 mt-4">Logout</a>
    </div>

</body>
</html>
