<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create Quiz</title>
    <link rel="stylesheet" href="/static/css/output.css">
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-2xl font-semibold mb-4">Create Quiz</h2>
        <form id="quizForm" class="space-y-4">
            <input type="text" id="quizTitle" class="w-full p-2 border rounded" placeholder="Quiz Title" required>
            <textarea id="quizDescription" class="w-full p-2 border rounded" placeholder="Quiz Description"></textarea>
            
            <div id="questionsContainer" class="space-y-4">
                <div class="question p-4 border rounded bg-gray-50">
                    <input type="text" class="question_text w-full p-2 border rounded" placeholder="Enter question" required>
                    <div class="grid grid-cols-2 gap-2 mt-2">
                        <input type="text" class="option p-2 border rounded" placeholder="Option 1" required>
                        <input type="text" class="option p-2 border rounded" placeholder="Option 2" required>
                        <input type="text" class="option p-2 border rounded" placeholder="Option 3" required>
                        <input type="text" class="option p-2 border rounded" placeholder="Option 4" required>
                    </div>
                    <input type="text" class="correct_answer w-full p-2 border rounded mt-2" placeholder="Correct Answer" required>
                </div>
            </div>
            
            <button type="button" onclick="addQuestion()" class="bg-blue-500 text-white px-4 py-2 rounded">Add Question</button>
            <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded">Create Quiz</button>
        </form>
    </div>
    <script src="/static/js/createQuiz.js"></script>
</body>
</html>
