{% extends "base.html" %}
{% block title %}Preview Quiz - QUBE{% endblock %}
{% block content %}

<div class="w-full bg-gradient-to-b from-indigo-50 to-white min-h-screen pb-10">
    <!-- Header Banner -->
    <div class="bg-gradient-to-r from-indigo-600 to-purple-700 px-6 py-5 shadow-lg">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between">
            <div class="mb-4 md:mb-0">
                <h2 class="text-white text-2xl md:text-3xl font-bold tracking-tight">Quiz Preview</h2>
                <p class="text-indigo-100 text-sm mt-1">Review your quiz before publishing</p>
            </div>
            <div class="flex gap-3">
                <button id="backToEdit" class="bg-white text-indigo-700 px-5 py-2.5 rounded-lg shadow-md hover:bg-gray-100 transition font-medium flex items-center">
                    <i class="fas fa-arrow-left mr-2"></i> Back to Editor
                </button>
                <button id="saveQuiz" class="bg-green-500 text-white px-5 py-2.5 rounded-lg shadow-md hover:bg-green-600 transition font-medium flex items-center">
                    <i class="fas fa-save mr-2"></i> Save Quiz
                </button>
            </div>
        </div>
    </div>

    <!-- Quiz info section -->
    <div class="max-w-4xl mx-auto mt-8 mb-6 p-8 bg-white rounded-2xl shadow-lg border border-gray-100">
        <h1 id="previewTitle" class="text-3xl font-bold text-center text-gray-800 mb-2">Quiz Title</h1>
        <p id="previewSubject" class="text-center text-gray-600 mb-4 text-lg">Subject</p>
        <div class="flex justify-center items-center gap-6 text-gray-500">
            <span class="flex items-center bg-indigo-50 rounded-full px-4 py-2">
                <i class="fas fa-question-circle mr-2 text-indigo-600"></i>
                <span id="questionCount" class="font-medium">0</span> questions
            </span>
            <span class="flex items-center bg-purple-50 rounded-full px-4 py-2">
                <i class="far fa-calendar-alt mr-2 text-purple-600"></i>
                Created <span id="creationDate" class="ml-1 font-medium"></span>
            </span>
        </div>
    </div>

    <!-- Quiz content section -->
    <div id="previewContainer" class="max-w-4xl mx-auto">
        <div id="loadingIndicator" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-indigo-200 border-t-indigo-600"></div>
            <p class="mt-4 text-indigo-600 font-medium">Loading quiz preview...</p>
        </div>
    </div>
</div>

<!-- Hidden form for submission -->
<form id="quizForm" method="POST" action="{{ url_for('quiz.save_quiz') }}" class="hidden">
    <input type="hidden" name="quiz_data" id="quizData">
    {% if csrf_token %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% endif %}
</form>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Retrieve quiz data from localStorage
    const quizData = JSON.parse(localStorage.getItem('previewQuizData'));
    
    if (!quizData) {
        document.getElementById('previewContainer').innerHTML = `
            <div class="text-center py-12">
                <div class="bg-red-50 p-8 rounded-xl inline-block shadow-md border border-red-100">
                    <i class="fas fa-exclamation-circle text-red-500 text-4xl mb-4"></i>
                    <p class="text-red-700 font-medium text-lg">No quiz data found. Please go back and create a quiz.</p>
                    <button id="goToCreate" class="mt-4 bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">
                        Create a Quiz
                    </button>
                </div>
            </div>
        `;
        document.getElementById('saveQuiz').disabled = true;
        document.getElementById('saveQuiz').classList.add('opacity-50');
        
        document.getElementById('goToCreate')?.addEventListener('click', function() {
            window.location.href = '{{ url_for("quiz.create_quiz_page") }}';
        });
        return;
    }

    // Set quiz info
    document.getElementById('previewTitle').textContent = quizData.title || 'Untitled Quiz';
    document.getElementById('previewSubject').textContent = quizData.subject || 'No Subject';
    document.getElementById('questionCount').textContent = quizData.questions.length;
    
    // Set creation date
    const now = new Date();
    document.getElementById('creationDate').textContent = now.toLocaleDateString();
    
    // Hide loading indicator
    document.getElementById('loadingIndicator').classList.add('hidden');
    
    // Function to render quiz questions
    function renderQuiz() {
        const container = document.getElementById('previewContainer');
        let quizHTML = '';
        
        quizData.questions.forEach((question, qIndex) => {
            quizHTML += `
                <div class="mb-10 bg-white rounded-xl shadow-lg overflow-hidden border border-gray-100 transform transition-all hover:shadow-xl">
                    <div class="bg-gradient-to-r from-indigo-100 to-purple-100 px-6 py-4 border-b border-gray-200">
                        <div class="flex items-center">
                            <div class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white h-8 w-8 rounded-full flex items-center justify-center mr-3 shadow-md">
                                <span class="font-bold">${qIndex + 1}</span>
                            </div>
                            <h3 class="font-semibold text-xl text-gray-800">Question ${qIndex + 1}</h3>
                        </div>
                    </div>
                    <div class="p-6">
                        <p class="text-xl mb-5 font-medium text-gray-800">${question.text}</p>
                        
                        ${question.image ? `
                            <div class="mb-6 rounded-xl overflow-hidden border border-gray-200 shadow-sm">
                                <img src="${question.image}" alt="Question image" class="max-h-72 mx-auto">
                            </div>
                        ` : ''}
                        
                        <div class="mt-4">
                            <div class="flex items-center mb-4">
                                ${question.type === 'single' ? 
                                    '<span class="bg-blue-100 text-blue-800 text-sm font-medium px-3 py-1 rounded-full mr-3"><i class="fas fa-circle-dot mr-1"></i>Single choice</span>' : 
                                    '<span class="bg-purple-100 text-purple-800 text-sm font-medium px-3 py-1 rounded-full mr-3"><i class="fas fa-check-square mr-1"></i>Multiple choice</span>'
                                }
                                <p class="text-gray-600">
                                    ${question.type === 'single' ? 'Select one correct answer' : 'Select all correct answers'}
                                </p>
                            </div>
                            
                            <div class="space-y-4 mt-4">
                                ${question.options.map((option, oIndex) => `
                                    <div class="bg-gray-50 rounded-xl p-5 border-2 transition-all ${option.isCorrect ? 'border-green-500 shadow-md' : 'border-gray-100 hover:border-gray-200'} hover:bg-gray-50">
                                        <div class="flex items-start">
                                            <div class="mt-1 mr-4">
                                                <div class="${question.type === 'single' ? 'h-6 w-6 rounded-full' : 'h-6 w-6 rounded'} 
                                                    ${option.isCorrect ? 'bg-green-500 border-2 border-green-500' : 'border-2 border-gray-400'} 
                                                    flex items-center justify-center">
                                                    ${option.isCorrect ? '<i class="fas fa-check text-white"></i>' : ''}
                                                </div>
                                            </div>
                                            <div class="flex-grow">
                                                <p class="text-gray-800 text-lg ${option.isCorrect ? 'font-medium' : ''}">${option.text}</p>
                                                ${option.image ? `
                                                    <div class="mt-4 rounded-lg overflow-hidden border border-gray-200 shadow-sm">
                                                        <img src="${option.image}" alt="Option image" class="max-h-48">
                                                    </div>
                                                ` : ''}
                                            </div>
                                            ${option.isCorrect ? `
                                                <div class="ml-3 text-green-500 text-lg">
                                                    <i class="fas fa-check-circle"></i>
                                                </div>
                                            ` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = quizHTML;
    }
    
    // Render the quiz
    renderQuiz();
    
    // Button handlers
    document.getElementById('backToEdit').addEventListener('click', function() {
        // Navigate directly to the create quiz page
        window.location.href = '{{ url_for("quiz.create_quiz_page") }}';
    });
    
    document.getElementById('saveQuiz').addEventListener('click', function() {
        // Submit the form with quiz data
        document.getElementById('quizData').value = JSON.stringify(quizData);
        document.getElementById('quizForm').submit();
    });
});
</script>

{% endblock %}
