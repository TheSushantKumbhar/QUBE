<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Live Quiz</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6366F1 0%, #2563EB 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .join-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 500px;
            transition: all 0.3s ease;
        }

        .join-card:hover {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            transform: translateY(-5px);
        }

        .room-code-input {
            letter-spacing: 10px;
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            text-transform: uppercase;
        }

        .join-btn {
            background: linear-gradient(45deg, #3B82F6, #8B5CF6);
            transition: all 0.3s ease;
        }

        .join-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        .room-code-input::placeholder {
            letter-spacing: normal;
            font-size: 16px;
            font-weight: normal;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(99, 102, 241, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(99, 102, 241, 0);
            }
        }

        .pulse {
            animation: pulse 1.5s infinite;
        }

        .error-message {
            background-color: #FEE2E2;
            border-left: 4px solid #DC2626;
            color: #991B1B;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 0.375rem;
            display: none;
        }
    </style>
</head>

<body>
    <div class="container mx-auto px-4">
        <div class="join-card">
            <div class="bg-indigo-600 text-white p-6 text-center">
                <div class="inline-block bg-white bg-opacity-20 rounded-full p-3 mb-4">
                    <i class="fas fa-gamepad text-4xl"></i>
                </div>
                <h1 class="text-3xl font-bold">Join Live Quiz</h1>
                <p class="mt-2 text-indigo-100">Enter the room code provided by your quiz host</p>
            </div>

            <div class="p-8">
                <div id="errorMessage" class="error-message">
                    <div class="flex items-center">
                        <i class="fas fa-exclamation-circle mr-2"></i>
                        <span id="errorText">Error message here</span>
                    </div>
                </div>

                <form id="joinForm" class="space-y-6">
                    <div>
                        <label for="roomCode" class="block text-sm font-medium text-gray-700 mb-1">Room Code</label>
                        <input type="text" id="roomCode" maxlength="6" 
                            class="room-code-input block w-full p-4 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" 
                            placeholder="Enter code" required>
                    </div>

                    <div>
                        <label for="displayName" class="block text-sm font-medium text-gray-700 mb-1">Your Name</label>
                        <input type="text" id="displayName" maxlength="20"
                            class="block w-full p-4 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" 
                            placeholder="Enter your name" required>
                    </div>

                    <button type="submit" id="joinButton" 
                        class="join-btn w-full py-4 px-6 text-white font-bold rounded-lg flex items-center justify-center">
                        <i class="fas fa-sign-in-alt mr-2"></i>
                        Join Quiz
                    </button>
                </form>
            </div>

            <div class="bg-gray-50 p-6 border-t border-gray-100 text-center">
                <p class="text-gray-600 text-sm">Want to create your own quiz? <a href="/createQuiz" class="text-indigo-600 font-medium">Sign up now</a></p>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-gray-900 bg-opacity-50 items-center justify-center z-50 hidden">
        <div class="bg-white p-8 rounded-lg shadow-xl text-center max-w-md w-full mx-4">
            <div class="pulse inline-block bg-indigo-100 rounded-full p-4 mb-4">
                <i class="fas fa-spinner fa-spin text-4xl text-indigo-600"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">Joining Quiz...</h3>
            <p class="text-gray-600">Connecting to room <span id="roomCodeDisplay" class="font-bold text-indigo-600"></span></p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const socket = io();
            const joinForm = document.getElementById('joinForm');
            const roomCodeInput = document.getElementById('roomCode');
            const displayNameInput = document.getElementById('displayName');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const roomCodeDisplay = document.getElementById('roomCodeDisplay');

            // Convert room code input to uppercase automatically
            roomCodeInput.addEventListener('input', function () {
                this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            });

            // Handle form submission
            joinForm.addEventListener('submit', function (e) {
                e.preventDefault();
                
                const roomCode = roomCodeInput.value.trim().toUpperCase();
                const displayName = displayNameInput.value.trim();
                
                // Simple validation
                if (roomCode.length < 6) {
                    showError('Room code must be 6 characters');
                    return;
                }
                
                if (!displayName) {
                    showError('Please enter your name');
                    return;
                }

                if (displayName.length < 2 || displayName.length > 20) {
                    showError('Name must be between 2-20 characters');
                    return;
                }
                
                // Show loading overlay
                showLoading(roomCode);
                
                // Attempt to join the room
                socket.emit('join_participant_room', {
                    room_code: roomCode,
                    display_name: displayName
                });
            });

            // Handle socket connection event
            socket.on('connect', function() {
                console.log('Connected to server');
            });

            // Handle socket connection error
            socket.on('connect_error', function() {
                hideLoading();
                showError('Unable to connect to server. Please try again');
            });

            // Handle join response
            socket.on('join_response', function(data) {
                if (data.success) {
                    // Redirect to participant view
                    window.location.href = `/live/participant/${data.room_code}`;
                } else {
                    hideLoading();
                    showError(data.error || 'Failed to join the room');
                }
            });

            // Helper function to show error message
            function showError(message) {
                errorText.textContent = message;
                errorMessage.style.display = 'block';
                
                // Auto hide after 5 seconds
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 5000);
            }
            
            // Helper function to show loading overlay
            function showLoading(roomCode) {
                roomCodeDisplay.textContent = roomCode;
                loadingOverlay.classList.remove('hidden');
            }
            
            // Helper function to hide loading overlay
            function hideLoading() {
                loadingOverlay.classList.add('hidden');
            }

            // Auto-focus on room code input
            roomCodeInput.focus();
        });
    </script>
</body>
</html>
