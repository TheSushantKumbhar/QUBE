{% extends 'base.html' %}
{% block title %}Live Quiz App{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto text-center mt-20">
    <h1 class="text-4xl font-bold mb-8">Welcome to the Live Quiz Platform</h1>

    <div class="space-y-6">
        <a href="{{ url_for('live.host_room') }}">
            <button class="w-full bg-indigo-600 text-white text-lg px-6 py-3 rounded-lg shadow hover:bg-indigo-700 transition">
                Host a Quiz
            </button>
        </a>

        <a href="{{ url_for('live.join_room') }}">
            <button class="w-full bg-green-600 text-white text-lg px-6 py-3 rounded-lg shadow hover:bg-green-700 transition">
                Join a Quiz Room
            </button>
        </a>
    </div>
</div>
{% endblock %}
